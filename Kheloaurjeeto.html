
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Khelo Aur Jeeto - Spin &amp; Win | Shubham Sales and Services</title>
<meta name="description" content="Khelo Aur Jeeto: press and hold the green button to spin the wheel and win free mobile accessories.">
<style>
  :root{
    --bg1:#1b0b3a;
    --bg2:#3b0a4f;
    --gold:#ffcf3f;
    --gold-dark:#c98a00;
    --ink:#fff7e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 30%, #5b1a7a 0%, transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:1.6dvh 3vw 1dvh;
    gap:.6dvh;
    overflow:hidden;
    touch-action:manipulation;
  }
  h1{
    margin:0;
    font-size:clamp(20px,5.4dvh,42px);
    font-weight:900;
    letter-spacing:.5px;
    text-align:center;
    color:var(--gold);
    text-shadow:0 2px 0 #a55d00,0 4px 0 #6b3300,0 8px 14px rgba(0,0,0,.55);
  }
  .sub{margin:0 0 12px;font-size:clamp(10px,1.6dvh,14px);opacity:.85;text-align:center}

  /* ---------- round tracker ---------- */
  .rounds{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;flex-shrink:0;width:min(94vw,420px);margin-top:4px}
  .round-item{
    display:flex;flex-direction:column;gap:5px;flex:1 1 0;min-width:0;
    background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid rgba(255,207,63,.4);border-radius:14px;
    padding:8px 8px 9px;box-shadow:0 4px 10px rgba(0,0,0,.35);
  }
  .r-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .r-label{font-weight:900;color:var(--gold);font-size:clamp(10px,1.7dvh,14px);white-space:nowrap}
  .r-dot{
    width:13px;height:13px;border-radius:50%;flex-shrink:0;
    background:#5b5b6f;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
    transition:background .25s ease, box-shadow .25s ease;
  }
  .round-item.done{border-color:rgba(255,59,59,.55);background:linear-gradient(160deg,rgba(255,59,59,.14),rgba(255,255,255,.04))}
  .round-item.done .r-dot{background:#ff3b3b;box-shadow:0 0 9px rgba(255,59,59,.9)}
  .r-prize{
    font-size:clamp(9px,1.5dvh,12.5px);line-height:1.25;opacity:.9;min-height:2.4em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .round-item.done .r-prize{opacity:1;font-weight:700;color:#fff}

  /* ---------- wheel ---------- */
  .stage{position:relative;width:min(72vw,40dvh,340px);aspect-ratio:1;margin:0 auto;flex-shrink:0;touch-action:none;cursor:grab}
  .stage.dragging{cursor:grabbing}
  .rim{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,#ffe27a,#d99a00 55%,#8a5400);
    box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 -6px 12px rgba(0,0,0,.35);
  }
  .bulbs{position:absolute;inset:0;border-radius:50%}
  .bulb{
    position:absolute;width:3.2%;height:3.2%;border-radius:50%;
    background:#fff6c4;box-shadow:0 0 8px 2px #ffe680;
    transform:translate(-50%,-50%);
    animation:blink 1s ease-in-out infinite;
  }
  .bulb:nth-child(even){animation-delay:.5s}
  @keyframes blink{50%{opacity:.3}}
  .stage.spinning .bulb{animation-duration:.4s}
  #wheel{
    position:absolute;inset:4.5%;width:91%;height:91%;border-radius:50%;
    will-change:transform;
    box-shadow:0 0 0 4px #7a4a00, inset 0 0 20px rgba(0,0,0,.4);
  }
  .hub{
    position:absolute;left:50%;top:50%;width:15%;height:15%;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3b0,#e0a400 60%,#7a4a00);
    box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.35);
    display:grid;place-items:center;font-size:clamp(14px,4vw,22px);
  }
  .pointer{
    position:absolute;left:50%;top:-3.5%;width:11%;height:14%;
    transform:translateX(-50%);transform-origin:50% 20%;z-index:5;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.55));
  }
  .pointer svg{width:100%;height:100%;display:block}
  .pointer.flap{animation:flap .09s ease-out}
  @keyframes flap{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-22deg)}100%{transform:translateX(-50%) rotate(0)}}

  /* ---------- big circle + 3D green button ---------- */
  .base{
    position:relative;margin:16px 0;flex-shrink:0;
    width:min(46vw,23dvh,205px);aspect-ratio:1;border-radius:50%;
    background:linear-gradient(145deg,#d7d9de,#9a9ea8 55%,#6b6f79);
    box-shadow:0 10px 18px rgba(0,0,0,.55), inset 0 3px 4px rgba(255,255,255,.7), inset 0 -5px 8px rgba(0,0,0,.4);
    display:grid;place-items:center;
    transition:box-shadow .1s ease;
  }
  .base.pressed{
    box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 3px 4px rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.55);
  }
  .well{
    width:84%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 65%,#8d919c,#4b4f59);
    box-shadow:inset 0 8px 14px rgba(0,0,0,.65), inset 0 -3px 5px rgba(255,255,255,.3), 0 1px 1px rgba(255,255,255,.6);
    transition:box-shadow .08s ease;
  }
  .base.pressed .well{
    box-shadow:inset 0 16px 24px rgba(0,0,0,.9), inset 0 -2px 4px rgba(255,255,255,.15), 0 1px 1px rgba(255,255,255,.6);
  }
  #btn{
    position:relative;width:80%;aspect-ratio:1;border:0;border-radius:50%;padding:0;cursor:pointer;
    background:radial-gradient(circle at 35% 28%,#b6ff9a 0%,#3fdc45 38%,#12a020 75%,#0a7414 100%);
    box-shadow:
      0 8px 0 #0a5a12,
      0 12px 14px rgba(0,0,0,.5),
      inset 0 6px 10px rgba(255,255,255,.55),
      inset 0 -10px 16px rgba(0,60,0,.45);
    transition:transform .08s ease, box-shadow .08s ease;
    color:#fff;font-weight:900;font-size:clamp(13px,3.2dvh,22px);letter-spacing:.5px;
    text-shadow:0 2px 0 #0a5a12,0 4px 8px rgba(0,0,0,.45);
    touch-action:none;outline:none;
  }
  #btn small{display:block;font-size:.38em;font-weight:700;letter-spacing:.5px;opacity:.95;margin-top:1px;padding-bottom:10px}
  #btn.down{
    transform:translateY(7px) scale(.95);
    box-shadow:
      0 1px 0 #0a5a12,
      0 2px 5px rgba(0,0,0,.55),
      inset 0 4px 8px rgba(255,255,255,.35),
      inset 0 -6px 12px rgba(0,60,0,.55);
    filter:brightness(1.08) saturate(1.15);
  }
  #btn:disabled{filter:grayscale(.75) brightness(.8);cursor:not-allowed}
  #btn:focus-visible{outline:4px solid #fff;outline-offset:6px}

  /* ---------- progress ---------- */
  .power{width:min(84vw,360px);margin-top:0;flex-shrink:0}
  .power-label{display:flex;justify-content:space-between;font-size:clamp(10px,1.6dvh,13px);margin-bottom:3px;opacity:.9}
  .bar{
    height:clamp(12px,2.4dvh,20px);border-radius:14px;background:#120626;overflow:hidden;
    border:2px solid #7a4a00;box-shadow:inset 0 3px 8px rgba(0,0,0,.6);
  }
  #fill{
    height:100%;width:100%;border-radius:12px;transform:scaleX(0);transform-origin:left center;
    background:linear-gradient(90deg,#3fdc45,#ffe135,#ff9a1f,#ff3b3b);
    box-shadow:0 0 12px rgba(255,200,60,.8);
  }

  .bottom-row{
    margin-top:auto;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:clamp(9px,1.4dvh,12px);opacity:.85;text-align:center;
  }

  /* ---------- result ---------- */
  #overlay{
    position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:rgba(10,0,25,.75);backdrop-filter:blur(3px);padding:16px;overflow:hidden;
  }
  #overlay.show{display:grid;animation:ovIn .35s ease-out both}
  #overlay.closing{animation:ovOut .3s ease-in both}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  @keyframes ovOut{from{opacity:1}to{opacity:0}}

  .rays{
    position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
    background:repeating-conic-gradient(from 0deg,rgba(255,207,63,.30) 0 8deg,transparent 8deg 16deg);
    -webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);
            mask-image:radial-gradient(circle,#000 0,transparent 42%);
    animation:raySpin 16s linear infinite;pointer-events:none;
  }
  @keyframes raySpin{to{transform:rotate(360deg)}}
  #overlay.lose .rays{display:none}

  .card{
    position:relative;
    width:min(94vw,460px);text-align:center;padding:26px 20px 24px;border-radius:26px;
    background:linear-gradient(160deg,#4a1670,#22093f);
    border:4px solid var(--gold);
    box-shadow:0 0 50px rgba(255,207,63,.55),0 20px 40px rgba(0,0,0,.6);
    animation:cardIn .75s cubic-bezier(.2,1.3,.4,1) both;
  }
  .card::before{
    content:"";position:absolute;left:50%;top:50%;width:60%;height:60%;
    transform:translate(-50%,-50%) scale(.2);border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,207,63,.5) 45%,transparent 72%);
    opacity:0;animation:flash .6s ease-out both;pointer-events:none;z-index:-1;
  }
  @keyframes flash{0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
  @keyframes cardIn{
    0%{transform:scale(.2) rotate(-14deg) translateY(90px);opacity:0}
    60%{transform:scale(1.07) rotate(3deg) translateY(0);opacity:1}
    100%{transform:scale(1) rotate(0)}
  }
  #overlay.closing .card{animation:cardOut .3s ease-in both}
  @keyframes cardOut{to{transform:scale(.6) translateY(50px) rotate(4deg);opacity:0}}

  .card .emoji{
    display:inline-block;font-size:64px;line-height:1;
    animation:emojiIn .8s .25s cubic-bezier(.2,1.6,.4,1) backwards, wobble 1.8s 1.1s ease-in-out infinite;
  }
  @keyframes emojiIn{from{transform:scale(0) rotate(-200deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes wobble{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.15)}}

  .card h2{
    margin:8px 0 6px;font-size:clamp(26px,7.2vw,40px);line-height:1.15;font-weight:900;color:var(--gold);
    text-shadow:0 3px 0 #a55d00,0 8px 16px rgba(0,0,0,.5);
    animation:beat 1.6s 1.6s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .card h2 .w{display:inline-block;white-space:nowrap}
  .card h2 .ch{display:inline-block;animation:drop .6s cubic-bezier(.2,1.6,.4,1) backwards}
  @keyframes drop{from{transform:translateY(-70px) scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}

  .card .won{font-size:16px;opacity:.85;margin:4px 0;animation:fadeUp .5s .55s ease-out backwards}
  .card .prize{
    font-size:clamp(22px,6.5vw,32px);font-weight:900;margin:4px 0 18px;color:#fff;
    animation:prizeIn .7s .75s cubic-bezier(.2,1.6,.4,1) backwards;
  }
  @keyframes prizeIn{from{transform:scale(.2);opacity:0;filter:blur(6px)}to{transform:scale(1);opacity:1;filter:blur(0)}}
  @keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:.85}}
  .card.lose h2{color:#9fd0ff;text-shadow:0 3px 0 #1c4d8a}
  .again{
    border:0;cursor:pointer;font-weight:900;font-size:20px;padding:14px 34px;border-radius:40px;color:#fff;
    background:linear-gradient(#4be050,#12a020);box-shadow:0 6px 0 #0a5a12,0 12px 18px rgba(0,0,0,.45);
    animation:fadeUpBtn .5s 1.1s ease-out backwards, glowBtn 1.5s 1.7s ease-in-out infinite;
  }
  @keyframes fadeUpBtn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes glowBtn{50%{filter:brightness(1.18)}}
  .again:active{transform:translateY(5px);box-shadow:0 1px 0 #0a5a12}
  .again:focus-visible{outline:4px solid #fff;outline-offset:4px}
  #confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

  @media (prefers-reduced-motion:reduce){
    .bulb,.rays,.card,.card *,.again{animation:none !important}
  }
</style>
</head>
<body>

<h1>Khelo Aur Jeeto</h1>
<p class="sub">Press and hold the green button to spin. Release to stop!</p>

<div class="stage" id="stage">
  <div class="rim"></div>
  <div class="bulbs" id="bulbs"></div>
  <canvas id="wheel" width="720" height="720"></canvas>
  <div class="hub">⭐</div>
  <div class="pointer" id="pointer">
    <svg viewBox="0 0 60 80"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ff5252"/><stop offset="1" stop-color="#b30000"/></linearGradient></defs>
      <path d="M30 78 L4 22 A28 28 0 1 1 56 22 Z" fill="url(#pg)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="30" cy="24" r="9" fill="#fff"/></svg>
  </div>
</div>

<div class="base">
  <div class="well">
    <button id="btn" aria-label="Press and hold to spin the wheel">SPIN<small>Press &amp; Hold</small></button>
  </div>
</div>

<div class="rounds" id="rounds">
  <div class="round-item" id="round1">
    <div class="r-top"><span class="r-label">Round 1</span><span class="r-dot"></span></div>
    <div class="r-prize" id="r1prize">Not played yet</div>
  </div>
  <div class="round-item" id="round2">
    <div class="r-top"><span class="r-label">Round 2</span><span class="r-dot"></span></div>
    <div class="r-prize" id="r2prize">Not played yet</div>
  </div>
  <div class="round-item" id="round3">
    <div class="r-top"><span class="r-label">Round 3</span><span class="r-dot"></span></div>
    <div class="r-prize" id="r3prize">Not played yet</div>
  </div>
</div>

<div class="power">
  <div class="power-label"><span>Spin Power</span><span id="pct">0%</span></div>
  <div class="bar"><div id="fill"></div></div>
</div>

<div class="bottom-row">
  <span>Shubham Sales and Services</span>
</div>

<div id="overlay" role="dialog" aria-modal="true">
  <div class="rays"></div>
  <div class="card" id="card">
    <div class="emoji" id="rEmoji">🎉</div>
    <h2 id="rTitle">Congratulations!</h2>
    <div class="won" id="rSub">You won</div>
    <div class="prize" id="rPrize"></div>
    <button class="again" id="again">Play Again</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
  "use strict";

  /* =====================  PRIZES  ===================== */
  // "win" = true means the wheel's main pointer can really stop on it.
  var P = {
    tryAgain:{lines:["Try","Again"],   icon:"🔁", name:"Try Again",       win:true,  weight:20, color:"#5b5b8f"},
    cashback:{lines:["20 Rs","Cashback"],icon:"💰", name:"20 Rs Cashback",  win:true,  weight:15,  color:"#e0a100"},
    tempered:{lines:["2 Mobile","Tempered"],icon:"🛡️", name:"2 Mobile Tempered",win:true,weight:15, color:"#0e9aa7"},
    earphone:{lines:["1 Earphone"],    icon:"🎧", name:"1 Earphone",      win:true,  weight:15, color:"#e2483d"},
    cable:   {lines:["Data","Cable"],icon:"🔌", name:"Data Cable",win:true, weight:15, color:"#7b3fe4"},
    chargerKeypad:{lines:["Charger AC","Keypad"],icon:"🔋", name:"Charger AC Keypad", win:true, weight:15, color:"#2e9e4f"},
    bluetooth:{lines:["1 Bluetooth"],  icon:"🔊", name:"1 Bluetooth",     win:false, color:"#1f6fe0"},
    chargerAndroid:{lines:["Charger AC","Android"],icon:"⚡", name:"Charger AC Android", win:false, color:"#c96a00"},
    neckband:{lines:["1 Neckband"],    icon:"📿", name:"1 Neckband",      win:false, color:"#d6459a"},
    keypad:  {lines:["1 Mobile","Keypad"],icon:"📞", name:"1 Mobile Keypad",win:false, color:"#e8742a"}
  };

  // 12 slices, arranged so neighbours look different
  var SLICES = [
    P.tryAgain, P.cable, P.tempered, P.bluetooth, P.earphone, P.chargerKeypad,
    P.cashback, P.neckband, P.tempered, P.keypad, P.chargerAndroid, P.earphone
  ];
  var N = SLICES.length, SEG = 360 / N;

  /* =====================  DRAW WHEEL  ===================== */
  var cv = document.getElementById("wheel"), ctx = cv.getContext("2d");
  var W = cv.width, C = W / 2, R = C - 6;

  function drawWheel(){
    ctx.clearRect(0,0,W,W);
    for (var i=0;i<N;i++){
      var a0 = (i*SEG - 90) * Math.PI/180, a1 = ((i+1)*SEG - 90) * Math.PI/180;
      var s = SLICES[i];
      // slice fill with light radial shading
      var g = ctx.createRadialGradient(C,C,R*.15,C,C,R);
      g.addColorStop(0, shade(s.color,.25));
      g.addColorStop(1, s.color);
      ctx.beginPath(); ctx.moveTo(C,C); ctx.arc(C,C,R,a0,a1); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.stroke();

      // content
      ctx.save();
      ctx.translate(C,C);
      ctx.rotate((i+0.5)*SEG*Math.PI/180 - Math.PI/2);
      // icon (outer)
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "54px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText(s.icon, R-52, 0);
      // name (inner), reads outward
      ctx.textAlign = "right";
      ctx.font = "bold 30px 'Trebuchet MS',Arial,sans-serif";
      ctx.lineJoin = "round";
      var lh = 32, y0 = -((s.lines.length-1)*lh)/2;
      for (var k=0;k<s.lines.length;k++){
        ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.55)";
        ctx.strokeText(s.lines[k], R-100, y0+k*lh);
        ctx.fillStyle = "#fff";
        ctx.fillText(s.lines[k], R-100, y0+k*lh);
      }
      ctx.restore();
    }
    // inner ring
    ctx.beginPath(); ctx.arc(C,C,R*.16,0,Math.PI*2); ctx.fillStyle="#3a1d00"; ctx.fill();
  }
  function shade(hex,amt){
    var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
    r=Math.min(255,r+(255-r)*amt);g=Math.min(255,g+(255-g)*amt);b=Math.min(255,b+(255-b)*amt);
    return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
  }
  drawWheel();

  // rim bulbs
  (function(){
    var box = document.getElementById("bulbs"), n = 24;
    for (var i=0;i<n;i++){
      var a = i/n*Math.PI*2, d = document.createElement("div");
      d.className = "bulb";
      d.style.left = (50 + 47.6*Math.sin(a)) + "%";
      d.style.top  = (50 - 47.6*Math.cos(a)) + "%";
      box.appendChild(d);
    }
  })();

  /* =====================  AUDIO  ===================== */
  var AC = null, master = null, whirr = null;
  function initAudio(){
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  }
  function blip(freq, dur, type, vol, slideTo){
    if (!AC) return;
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(vol||.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
  }
  function sndPress(){ blip(520,.09,"square",.22,180); blip(90,.12,"sine",.35,50); }
  function sndRelease(){ blip(300,.08,"square",.16,600); }
  var lastTick = 0;
  function sndTick(speed){
    if (!AC) return;
    var now = AC.currentTime;
    if (now - lastTick < 0.018) return;   // avoid machine-gun overload
    lastTick = now;
    blip(1700 + Math.min(speed,1200)*0.25, .035, "triangle", .2);
  }
  function startWhirr(){
    if (!AC || whirr) return;
    var o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "sawtooth"; o2.type = "square";
    f.type = "lowpass"; f.frequency.value = 600;
    g.gain.value = 0.0001;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o.start(); o2.start();
    g.gain.exponentialRampToValueAtTime(0.09, AC.currentTime+.15);
    whirr = {o:o,o2:o2,f:f,g:g};
  }
  function updateWhirr(speed){
    if (!whirr) return;
    var t = AC.currentTime, fr = 70 + speed*0.28;
    whirr.o.frequency.setTargetAtTime(fr, t, .05);
    whirr.o2.frequency.setTargetAtTime(fr*1.51, t, .05);
    whirr.f.frequency.setTargetAtTime(400 + speed*1.6, t, .05);
    whirr.g.gain.setTargetAtTime(Math.min(.11, .03 + speed/12000), t, .08);
  }
  function stopWhirr(){
    if (!whirr) return;
    var w = whirr, t = AC.currentTime; whirr = null;
    w.g.gain.setTargetAtTime(0.0001, t, .03);
    setTimeout(function(){ try{ w.o.stop(); w.o2.stop(); }catch(e){} }, 250);
  }
  function sndWin(){
    var notes = [523,659,784,1047,784,1047,1319];
    notes.forEach(function(f,i){ setTimeout(function(){ blip(f,.28,"triangle",.28); blip(f*2,.2,"sine",.1); }, i*110); });
    setTimeout(function(){ blip(1568,.7,"triangle",.25); blip(1047,.7,"triangle",.2); blip(784,.7,"triangle",.2); }, 800);
  }
  function sndLose(){
    [440,392,349,294].forEach(function(f,i){ setTimeout(function(){ blip(f,.3,"sawtooth",.16,f*.92); }, i*170); });
  }

  /* =====================  VIBRATION  ===================== */
  function vib(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  /* =====================  GAME STATE  ===================== */
  var wheelEl = cv, stage = document.getElementById("stage"), pointer = document.getElementById("pointer");
  var btn = document.getElementById("btn"), fill = document.getElementById("fill"), pct = document.getElementById("pct");
  var overlay = document.getElementById("overlay"), card = document.getElementById("card"), base = document.querySelector(".base");

  var state = "idle";          // idle | holding | stopping | done
  var angle = 0;               // wheel rotation (deg, clockwise)
  var speed = 0;               // deg/sec
  var power = 0;               // 0..1
  var holdT = 0;                // seconds held — drives a fixed, repeatable acceleration curve
  var lastSeg = segAt(angle);
  var lastT = 0, vibTimer = null, lastPct = 0;
  var stopInfo = null;

  /* ---------- 3-round tracker ---------- */
  var roundItems = [document.getElementById("round1"), document.getElementById("round2"), document.getElementById("round3")];
  var roundPrizeEls = [document.getElementById("r1prize"), document.getElementById("r2prize"), document.getElementById("r3prize")];
  var currentRound = 0;   // 0,1,2 — which round is about to be played
  function resetRounds(){
    currentRound = 0;
    roundItems.forEach(function(el){ el.classList.remove("done"); });
    roundPrizeEls.forEach(function(el){ el.textContent = "Not played yet"; });
  }

  /* free drag (idle-only) — wheel can be spun by hand before the button is pressed */
  var dragActive = false, dragLastAngle = 0, dragLastTime = 0, idleVelocity = 0;
  var idleRAF = null, idleMomentumLastT = null;

  var MAX_SPEED = 1250, MIN_SPEED = 220, RAMP_SECONDS = 3.2;

  function segAt(a){
    var m = (((-a) % 360) + 360) % 360;
    return Math.floor(m / SEG) % N;
  }
  function pickPrize(){
    var list = [P.tryAgain,P.cashback,P.tempered,P.earphone,P.cable,P.chargerKeypad], total = 0, i;
    for (i=0;i<list.length;i++) total += list[i].weight;
    var r = Math.random()*total;
    for (i=0;i<list.length;i++){ r -= list[i].weight; if (r<=0) return list[i]; }
    return list[0];
  }
  function pickSliceFor(prize){
    var idx = [];
    for (var i=0;i<N;i++) if (SLICES[i] === prize) idx.push(i);
    return idx[Math.floor(Math.random()*idx.length)];
  }

  function pointerAngleDeg(e){
    var rect = stage.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI;
  }
  function idleDragStart(e){
    if (state !== "idle") return;
    e.preventDefault();
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    cancelAnimationFrame(idleRAF); idleRAF = null; idleMomentumLastT = null;
    dragActive = true; stage.classList.add("dragging");
    idleVelocity = 0;
    dragLastAngle = pointerAngleDeg(e);
    dragLastTime = performance.now();
    initAudio();
  }
  function idleDragMove(e){
    if (!dragActive) return;
    e.preventDefault();
    var a = pointerAngleDeg(e), now = performance.now();
    var dt = Math.max((now - dragLastTime)/1000, 0.001);
    var delta = a - dragLastAngle;
    if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
    angle += delta;
    // resistance: turning it feels like something inside is fighting the motion
    idleVelocity = idleVelocity*0.6 + (delta/dt)*0.4;
    dragLastAngle = a; dragLastTime = now;
    wheelEl.style.transform = "rotate(" + angle + "deg)";
    var sg = segAt(angle);
    if (sg !== lastSeg){ lastSeg = sg; sndTick(Math.abs(idleVelocity)); vib(6); }
  }
  function idleDragEnd(e){
    if (!dragActive) return;
    dragActive = false; stage.classList.remove("dragging");
    try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
    idleMomentumLastT = null;
    idleRAF = requestAnimationFrame(idleMomentumStep);
  }
  function idleMomentumStep(now){
    if (state !== "idle"){ idleVelocity = 0; idleMomentumLastT = null; return; }
    if (idleMomentumLastT === null) idleMomentumLastT = now;
    var dt = Math.min(0.05, (now - idleMomentumLastT)/1000);
    idleMomentumLastT = now;
    idleVelocity *= Math.pow(0.015, dt);           // strong friction — feels like it's fighting to keep spinning
    angle += idleVelocity*dt;
    wheelEl.style.transform = "rotate(" + angle + "deg)";
    var sg = segAt(angle);
    if (sg !== lastSeg){
      lastSeg = sg; sndTick(Math.abs(idleVelocity));
      if (Math.abs(idleVelocity) > 150) vib(5);
    }
    if (Math.abs(idleVelocity) > 3) idleRAF = requestAnimationFrame(idleMomentumStep);
    else { idleVelocity = 0; idleMomentumLastT = null; }
  }
  stage.addEventListener("pointerdown", idleDragStart);
  stage.addEventListener("pointermove", idleDragMove);
  stage.addEventListener("pointerup", idleDragEnd);
  stage.addEventListener("pointercancel", idleDragEnd);

  function press(e){
    if (e) e.preventDefault();
    if (state !== "idle") return;
    if (currentRound >= 3) resetRounds();   // all 3 rounds done — start a fresh set
    initAudio();
    state = "holding";
    speed = 0; power = 0; holdT = 0;
    btn.classList.add("down"); base.classList.add("pressed"); stage.classList.add("spinning");
    sndPress(); startWhirr();
    vib(45);
    clearInterval(vibTimer);
    vibTimer = setInterval(function(){ vib(18); }, 90);
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function release(e){
    if (e) e.preventDefault();
    btn.classList.remove("down"); base.classList.remove("pressed");
    if (state !== "holding") return;
    clearInterval(vibTimer); vib(0);
    stopWhirr();                                                  // no motor sound while slowing down

    if (holdT < 1){
      // held for less than 1 second — doesn't count, reset back to the start
      stage.classList.remove("spinning");
      sndRelease();
      angle = 0; speed = 0; power = 0;
      wheelEl.style.transform = "rotate(0deg)";
      fill.style.transform = "scaleX(0)"; pct.textContent = "0%"; lastPct = 0;
      lastSeg = segAt(angle);
      state = "idle";
      return;
    }

    // decide the result now, then glide to it smoothly
    var prize = pickPrize(), sliceIdx = pickSliceFor(prize);
    var offset = (Math.random()*2 - 1) * SEG * 0.32;             // stay inside the slice
    var centre = (sliceIdx + 0.5) * SEG + offset;
    var need = (((-centre) % 360) + 360) % 360;                   // final angle mod 360
    var v0 = speed;                                               // start exactly at current speed = no jerk
    var T = 9;                                                     // slow-down time (seconds) — much slower stop
    var D = Math.max(v0 * T * 0.5, 1400);                          // distance to travel
    var cur = ((angle % 360) + 360) % 360;
    var rem = (((need - (cur + D)) % 360) + 360) % 360;
    D += rem;
    stopInfo = {a0:angle, v0:v0, D:D, T:T, t:0, prize:prize};
    state = "stopping";
  }

  function loop(now){
    if (state === "idle" || state === "done") return;
    var dt = Math.min(0.05, (now - lastT)/1000); lastT = now;

    if (state === "holding"){
      holdT += dt;
      power = Math.min(1, holdT / RAMP_SECONDS);
      var e = power*power*power*(power*(power*6-15)+10);   // smootherstep: gentle start AND gentle top-out
      speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * e;      // pure function of hold time — same smooth ramp every spin
      angle += speed*dt;
    } else if (state === "stopping"){
      var s = stopInfo; s.t += dt;
      if (s.t >= s.T){
        angle = s.a0 + s.D; speed = 0; finish(s.prize);
      } else {
        var u = s.t / s.T;                                        // smooth curve: start speed -> 0, no sudden stop
        angle = s.a0 + (u*u*u - 2*u*u + u)*s.v0*s.T + (3*u*u - 2*u*u*u)*s.D;
        speed = s.v0*(3*u*u - 4*u + 1) + (6*u - 6*u*u)*s.D/s.T;
        power = Math.max(0, power - dt*0.35);
      }
    }

    // draw
    wheelEl.style.transform = "rotate(" + angle + "deg)";
    var sg = segAt(angle);
    if (sg !== lastSeg){
      lastSeg = sg;
      if (state === "holding") sndTick(speed);   // no tick sound while the wheel is slowing to a stop
      if (state === "stopping" && speed < 500) vib(10);
    }
    if (state === "holding") updateWhirr(speed);
    fill.style.transform = "scaleX(" + power.toFixed(3) + ")";
    var pv = Math.round(power*100); if (pv !== lastPct){ lastPct = pv; pct.textContent = pv + "%"; }

    if (state !== "done") requestAnimationFrame(loop);
  }

  /* =====================  RESULT  ===================== */
  function finish(prize){
    state = "done";
    stopWhirr();
    stage.classList.remove("spinning");
    power = 0; fill.style.transform = "scaleX(0)"; pct.textContent = "0%"; lastPct = 0;
    wheelEl.style.transform = "rotate(" + angle + "deg)";
    btn.disabled = true;

    var isWin = prize !== P.tryAgain;
    var roundNo = currentRound + 1;
    if (currentRound < 3){
      roundItems[currentRound].classList.add("done");
      roundPrizeEls[currentRound].textContent = prize.icon + " " + prize.name;
      currentRound++;
    }

    var rEmoji = document.getElementById("rEmoji"),
        rTitle = document.getElementById("rTitle"),
        rSub = document.getElementById("rSub"),
        rPrize = document.getElementById("rPrize");
    card.classList.toggle("lose", !isWin);
    overlay.classList.toggle("lose", !isWin);
    overlay.classList.remove("closing");
    if (isWin){
      rEmoji.textContent = "🎉";
      setTitle(rTitle, "Congratulations!");
      rSub.textContent = "Round " + roundNo + " — You won";
      rPrize.textContent = prize.icon + " " + prize.name;
      sndWin(); vib([120,60,120,60,120,60,400]);
      startConfetti();
    } else {
      rEmoji.textContent = "😅";
      setTitle(rTitle, "Try Again!");
      rSub.textContent = "Round " + roundNo + " — So close! Better luck on the next spin.";
      rPrize.textContent = "";
      sndLose(); vib([200,80,120]);
    }
    setTimeout(function(){ overlay.classList.add("show"); document.getElementById("again").focus(); }, 350);
  }

  // letter-by-letter animated title
  function setTitle(el, text){
    el.innerHTML = "";
    var idx = 0;
    text.split(" ").forEach(function(word, wi){
      if (wi) el.appendChild(document.createTextNode(" "));
      var w = document.createElement("span"); w.className = "w";
      word.split("").forEach(function(chr){
        var c = document.createElement("span"); c.className = "ch";
        c.textContent = chr; c.style.animationDelay = (0.35 + idx*0.05) + "s";
        w.appendChild(c); idx++;
      });
      el.appendChild(w);
    });
  }

  var closing = false;
  document.getElementById("again").addEventListener("click", function(){
    if (closing) return;
    closing = true;
    initAudio(); blip(660,.08,"square",.2);
    overlay.classList.add("closing");
    stopConfetti();
    setTimeout(function(){
      overlay.classList.remove("show","closing");
      btn.disabled = false;
      state = "idle";
      closing = false;
    }, 300);
  });

  /* =====================  CONFETTI  ===================== */
  var cf = document.getElementById("confetti"), cx = cf.getContext("2d"), parts = [], cfRun = false, cfEnd = 0;
  function sizeCf(){ cf.width = innerWidth; cf.height = innerHeight; }
  addEventListener("resize", sizeCf); sizeCf();
  var COLORS = ["#ffcf3f","#ff4d6d","#3fdc45","#38b6ff","#b455ff","#ff9a1f","#ffffff"];
  function burst(x,y,n){
    for (var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, v = 4 + Math.random()*11;
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*8,h:8+Math.random()*10,
        r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLORS[(Math.random()*COLORS.length)|0],life:1});
    }
  }
  function startConfetti(){
    parts = []; cfRun = true; cfEnd = performance.now() + 5500;
    burst(innerWidth*.2, innerHeight*.55, 90);
    burst(innerWidth*.8, innerHeight*.55, 90);
    burst(innerWidth*.5, innerHeight*.35, 110);
    var pops = 0, iv = setInterval(function(){
      if (!cfRun || ++pops > 7){ clearInterval(iv); return; }
      burst(Math.random()*innerWidth, Math.random()*innerHeight*.5, 70);
    }, 650);
    requestAnimationFrame(cfLoop);
  }
  function stopConfetti(){ cfRun = false; parts = []; cx.clearRect(0,0,cf.width,cf.height); }
  function cfLoop(now){
    if (!cfRun) return;
    cx.clearRect(0,0,cf.width,cf.height);
    for (var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.vy += .28; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (now > cfEnd - 1200) p.life -= .012;
      if (p.y > cf.height + 30 || p.life <= 0){ parts.splice(i,1); continue; }
      cx.save(); cx.globalAlpha = Math.max(0,p.life);
      cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    }
    if (parts.length) requestAnimationFrame(cfLoop); else cfRun = false;
  }

  /* =====================  INPUT  ===================== */
  btn.addEventListener("pointerdown", function(e){ try{ btn.setPointerCapture(e.pointerId); }catch(_){} press(e); });
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointercancel", release);
  btn.addEventListener("lostpointercapture", release);
  btn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  // keyboard: hold Space / Enter
  addEventListener("keydown", function(e){
    if ((e.code === "Space" || e.code === "Enter") && !e.repeat && document.activeElement === btn){ press(e); }
  });
  addEventListener("keyup", function(e){
    if ((e.code === "Space" || e.code === "Enter") && document.activeElement === btn){ release(e); }
  });
})();
</script>
</body>
</html>
